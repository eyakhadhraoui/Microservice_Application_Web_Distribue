nelmio_cors:
    defaults:
        origin_regex: true
        # Front Angular (4200), API Gateway (8095), Symfony local (8000), etc.
        allow_origin: ['^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        max_age: 3600
    paths:
        '^/api/': ~