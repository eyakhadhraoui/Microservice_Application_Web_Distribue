server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ✅ WebSocket SockJS/STOMP (NEPHRO) → gateway → dossiermedicale
    location ^~ /ws {
        set $kidneycare_gateway http://ai-gateway:8095;
        proxy_pass $kidneycare_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Anciens bundles Angular : /prescription/api/* → gateway /api/* (même contrat que MedicationService)
    location ^~ /prescription/api/ {
        rewrite ^/prescription/api/(.*)$ /api/$1 break;
        proxy_pass http://ai-gateway:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ✅ Auth → user-service direct
    location ~ ^/api/auth(/|$) {
        set $kidneycare_usersvc http://user-service:8000;
        proxy_pass $kidneycare_usersvc$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ✅ /api/users → user-service direct
    location ~ ^/api/users(/|$) {
        set $kidneycare_usersvc http://user-service:8000;
        proxy_pass $kidneycare_usersvc$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ✅ /users exact → user-service direct
    location = /users {
        set $kidneycare_usersvc http://user-service:8000;
        proxy_pass $kidneycare_usersvc/api/users;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ✅ /users/* → user-service direct
    location /users/ {
        set $kidneycare_usersvc http://user-service:8000;
        rewrite ^/users/(.*)$ /api/users/$1 break;
        proxy_pass $kidneycare_usersvc$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ✅ CORRECTION : /api/* général → gateway SAUF /api/auth et /api/users (déjà gérés au-dessus)
    # Les routes comme /api/dossiers-medicaux, /api/resultats-laboratoire, /api/tests-laboratoire
    # passent ici vers ai-gateway
    location ~ ^/api/((?!auth|users).+) {
        set $kidneycare_gateway http://ai-gateway:8095;
        proxy_pass $kidneycare_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ✅ Autres routes métier → gateway
    location ~ ^/(suivis|prescription|infection|projet|nephro|uploads)(/|$) {
        set $kidneycare_gateway http://ai-gateway:8095;
        proxy_pass $kidneycare_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Swagger / OpenAPI (gateway) — même origine que le front : évite erreurs iframe / URL mal copiée
    location = /swagger-ui.html {
        proxy_pass http://ai-gateway:8095/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /swagger-ui/ {
        proxy_pass http://ai-gateway:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /v3/api-docs {
        proxy_pass http://ai-gateway:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /webjars/ {
        proxy_pass http://ai-gateway:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ✅ Angular frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ✅ Assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}